<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08111a" />
    <meta
      name="description"
      content="Łap kropkę — prosta rodzinna gra zręcznościowa działająca na telefonie i komputerze."
    />
    <title>Łap kropkę!</title>
    <link rel="stylesheet" href="style.css" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="game-header">
        <p class="eyebrow">Rodzinna minigra 01</p>
        <h1>Łap kropkę!</h1>
        <p class="intro">Dotknij kolorowego celu tyle razy, ile zdołasz w 20 sekund.</p>
      </header>

      <section class="stats" aria-label="Wyniki gry">
        <div class="stat">
          <span class="stat-label">Wynik</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat stat-time">
          <span class="stat-label">Czas</span>
          <strong><span id="time">20</span><small> s</small></strong>
        </div>
        <div class="stat">
          <span class="stat-label">Rekord</span>
          <strong id="bestScore">0</strong>
        </div>
      </section>

      <section id="arena" class="arena" aria-label="Pole gry">
        <div class="arena-grid" aria-hidden="true"></div>

        <button id="target" class="target" type="button" aria-label="Złap kropkę" hidden>
          <span aria-hidden="true"></span>
        </button>

        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <div class="target-preview" aria-hidden="true"></div>
            <h2 id="overlayTitle">Gotowi?</h2>
            <p id="overlayText">Cel będzie zmieniał położenie po każdym trafieniu.</p>
            <button id="startButton" class="primary-button" type="button">Start</button>
          </div>
        </div>
      </section>

      <section class="actions" aria-label="Dodatkowe działania">
        <button id="shareButton" class="secondary-button" type="button">Udostępnij grę</button>
        <p id="shareStatus" class="share-status" aria-live="polite"></p>
      </section>

      <footer>
        <p>Na komputerze możesz używać również klawiszy <kbd>Tab</kbd> i <kbd>Enter</kbd>.</p>
      </footer>
    </main>
  </body>
</html>
